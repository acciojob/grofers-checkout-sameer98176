<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Monthly Savings</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <table style="width: 100%">
    <caption>Monthly savings</caption>

    <tr>
      <th>Item</th>
      <th>Prices in Rs</th>
    </tr>

    <tr>
      <td class="item">Tea</td>
      <td class="price">50</td>
    </tr>

    <tr>
      <td class="item">Coffee</td>
      <td class="price">70</td>
    </tr>

    <tr>
      <td class="item">Biscuits</td>
      <td class="price">100</td>
    </tr>

    <tr>
      <td class="item">Rice</td>
      <td class="price">130</td>
    </tr>

    <tr>
      <td class="item">Milk</td>
      <td class="price">50</td>
    </tr>

  </table>

  <script>
    const getSumBtn = document.createElement("button");
    getSumBtn.innerText = "Get Total Price";
    document.body.appendChild(getSumBtn);

    const getSum = () => {
      let prices = document.querySelectorAll(".price");
      let total = 0;

      prices.forEach(p => {
        total += Number(p.innerText);
      });

      let existing = document.getElementById("ans");

      if (existing) {
        existing.innerText = total;
        return;
      }

      let tr = document.createElement("tr");
      let td = document.createElement("td");

      td.setAttribute("colspan", "2");
      td.setAttribute("id", "ans");
      td.innerText = total;

      tr.appendChild(td);
      document.querySelector("table").appendChild(tr);
    };

    getSumBtn.addEventListener("click", getSum);
  </script>

</body>

</html>
